<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synthborn: Worldviewer</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <header class="titlebar">
    <div class="brand">Synthborn: Worldviewer</div>
    <div class="sky-scene titlebar-cycle" id="sky-scene" aria-label="World day and night cycle">
      <div class="sky-stars" id="sky-stars"></div>
      <div class="sky-body sky-sun" id="sky-sun"></div>
      <div class="sky-body sky-moon" id="sky-moon"></div>
      <svg class="sky-hills" viewBox="0 0 220 26" preserveAspectRatio="none" aria-hidden="true">
        <path class="hill-back" d="M0 14 Q 28 5 56 11 T 112 9 T 168 12 T 220 8 L 220 26 L 0 26 Z"></path>
        <path class="hill-front" d="M0 19 Q 36 12 74 17 T 150 16 T 220 18 L 220 26 L 0 26 Z"></path>
      </svg>
      <input id="time-cycle-label" class="cycle-time-box" type="text" value="--:--" readonly aria-label="World time">
    </div>
    <label class="map-time-toggle" title="Use world time for map lighting">
      <input id="map-time" type="checkbox">
      <span>Map time</span>
    </label>
    <div class="titlebar-actions">
      <label class="titlebar-toggle" title="Show mob cards and request mob feed updates">
        <input id="show-mobs" type="checkbox" checked>
        <span>Mobs</span>
      </label>
      <button id="panel-toggle" class="panel-toggle" type="button" aria-label="Toggle controls" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      </button>
    </div>
  </header>
  <div class="hud">
    <div class="brand">Settings</div>
    <div class="hud-section world-controls">
      <label>
        <span>World</span>
        <select id="world"></select>
      </label>
      <div class="field-row">
        <label>
          <span>Chunk X</span>
          <input id="chunk-x" type="number" value="0" step="1">
        </label>
        <label>
          <span>Chunk Z</span>
          <input id="chunk-z" type="number" value="0" step="1">
        </label>
      </div>
      <label class="paired-control mesh-distance-control">
        <span>Voxel Mesh Distance <output id="radius-diameter" for="radius-range radius">9 x 9 chunks, 81 meshes</output></span>
        <div class="range-number">
          <input id="radius-range" type="range" value="4" min="0" max="12" step="1" aria-label="Voxel mesh radius">
          <input id="radius" type="number" value="4" min="0" max="12" step="1" aria-label="Voxel mesh radius">
        </div>
      </label>
      <div class="toggle-row">
        <label class="toggle">
          <input id="auto-stream" type="checkbox" checked>
          <span>Auto</span>
        </label>
        <label class="toggle">
          <input id="debug-bounds" type="checkbox">
          <span>Bounds</span>
        </label>
        <label class="toggle">
          <input id="show-players" type="checkbox" checked>
          <span>Players</span>
        </label>
      </div>
    </div>
    <div class="hud-section render-controls">
      <div class="toggle-row">
        <label class="toggle">
          <input id="sun-lighting" type="checkbox" checked>
          <span>Sun</span>
        </label>
        <label class="toggle">
          <input id="tree-shade" type="checkbox" checked>
          <span>Shade</span>
        </label>
        <label class="toggle">
          <input id="map-tiles" type="checkbox" checked>
          <span>Map Tiles</span>
        </label>
        <label class="toggle" title="Animate terrain chunks rising from ground and sinking out">
          <input id="land-motion" type="checkbox" checked>
          <span>Land motion</span>
        </label>
      </div>
      <label class="paired-control">
        <span>Shade Size</span>
        <div class="range-number">
          <input id="shade-size" type="range" min="0.5" max="2.2" step="0.05" value="1.85">
          <input id="shade-size-value" type="number" min="0.5" max="2.2" step="0.05" value="1.85">
        </div>
      </label>
      <label class="paired-control">
        <span>Shade Dark</span>
        <div class="range-number">
          <input id="shade-darkness" type="range" min="0.15" max="1" step="0.01" value="0.4">
          <input id="shade-darkness-value" type="number" min="0.15" max="1" step="0.01" value="0.4">
        </div>
      </label>
      <label>
        <span>Water</span>
        <select id="water-mode">
          <option value="solid" selected>Solid</option>
          <option value="transparent">Transparent</option>
          <option value="shader">Shader</option>
          <option value="hidden">Hidden</option>
        </select>
      </label>
      <label>
        <span>Shader</span>
        <select id="shader-effect">
          <option value="none" selected>None</option>
          <option value="tiltShift">Tilt Shift</option>
          <option value="pixelMap">Pixel Map</option>
          <option value="vignette">Vignette</option>
          <option value="bloomLite">Bloom Lite</option>
          <option value="cartographicInk">Cartographic Ink</option>
          <option value="nightScan">Night Scan</option>
        </select>
      </label>
      <div id="experimental-details-state" class="feature-tag">Detailed trees: server off</div>
    </div>
  </div>
  <aside class="players-panel">
    <label class="player-rate-control">
      <span>Update</span>
      <select id="player-update-rate">
        <option value="2000">0.5 Hz</option>
        <option value="1000" selected>1 Hz</option>
        <option value="500">2 Hz</option>
        <option value="250">4 Hz</option>
      </select>
    </label>
    <div id="players" class="players">No players</div>
  </aside>
  <div class="info-card">
    <div id="info-card-head" class="info-card-head" role="button" tabindex="0" aria-expanded="true">
      <span class="info-card-title">Render Details</span>
      <span class="fps-readout" aria-label="Frames per second">
        <span class="fps-label">FPS</span>
        <span id="fps-value">0</span>
        <span id="fps-frame" class="fps-ms">0.0 ms</span>
      </span>
    </div>
    <dl class="info-grid">
      <dt>Status</dt><dd id="status">Starting</dd>
      <dt>Loaded</dt><dd id="metric-loaded">0 chunks</dd>
      <dt>Meshes</dt><dd id="metric-meshes">0</dd>
      <dt>Resources</dt><dd id="metric-resources">0 geo · 0 mat · 0 tex</dd>
      <dt>GPU</dt><dd id="metric-gpu">0 geo · 0 tex</dd>
      <dt>Disposed</dt><dd id="metric-disposed">0c · 0g · 0m · 0t</dd>
      <dt>Mobs</dt><dd id="metric-mobs">0</dd>
      <dt>Center</dt><dd id="metric-center">pending</dd>
      <dt>Target</dt><dd id="coord-target">—</dd>
      <dt>Chunk</dt><dd id="coord-chunk">—</dd>
      <dt>Camera</dt><dd id="coord-camera">—</dd>
    </dl>
  </div>
  <script type="module" src="/dist/worldview.js"></script>
</body>
</html>
