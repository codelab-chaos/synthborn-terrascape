<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SynthWorldview</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hud">
    <div class="brand">SynthWorldview</div>
    <div class="hud-section world-controls">
      <label>
        <span>World</span>
        <select id="world"></select>
      </label>
      <div class="field-row">
        <label>
          <span>Chunk X</span>
          <input id="chunk-x" type="number" value="0" step="1">
        </label>
        <label>
          <span>Chunk Z</span>
          <input id="chunk-z" type="number" value="0" step="1">
        </label>
        <label>
          <span>Radius</span>
          <input id="radius" type="number" value="10" min="0" step="1">
        </label>
      </div>
      <div class="toggle-row">
        <label class="toggle">
          <input id="auto-stream" type="checkbox" checked>
          <span>Auto</span>
        </label>
        <label class="toggle">
          <input id="debug-bounds" type="checkbox">
          <span>Bounds</span>
        </label>
        <label class="toggle">
          <input id="show-players" type="checkbox" checked>
          <span>Players</span>
        </label>
      </div>
    </div>
    <div class="hud-section render-controls">
      <div class="toggle-row">
        <label class="toggle">
          <input id="sun-lighting" type="checkbox" checked>
          <span>Sun</span>
        </label>
        <label class="toggle">
          <input id="tree-shade" type="checkbox" checked>
          <span>Shade</span>
        </label>
        <label class="toggle">
          <input id="lod-horizon" type="checkbox">
          <span>LOD</span>
        </label>
      </div>
      <label class="paired-control">
        <span>Shade Size</span>
        <div class="range-number">
          <input id="shade-size" type="range" min="0.5" max="2.2" step="0.05" value="1.85">
          <input id="shade-size-value" type="number" min="0.5" max="2.2" step="0.05" value="1.85">
        </div>
      </label>
      <label class="paired-control">
        <span>Shade Dark</span>
        <div class="range-number">
          <input id="shade-darkness" type="range" min="0.15" max="1" step="0.01" value="0.4">
          <input id="shade-darkness-value" type="number" min="0.15" max="1" step="0.01" value="0.4">
        </div>
      </label>
      <label>
        <span>Water</span>
        <select id="water-mode">
          <option value="solid" selected>Solid</option>
          <option value="transparent">Transparent</option>
          <option value="hidden">Hidden</option>
        </select>
      </label>
      <label>
        <span>Shader</span>
        <select id="shader-effect">
          <option value="none" selected>None</option>
          <option value="tiltShift">Tilt Shift</option>
          <option value="pixelMap">Pixel Map</option>
          <option value="vignette">Vignette</option>
          <option value="bloomLite">Bloom Lite</option>
          <option value="cartographicInk">Cartographic Ink</option>
          <option value="nightScan">Night Scan</option>
        </select>
      </label>
      <div class="time-ribbon" aria-label="World day and night cycle">
        <div class="time-ribbon-header">
          <span>Cycle</span>
          <span id="time-cycle-label">--:--</span>
        </div>
        <div class="time-ribbon-track">
          <div id="time-cycle-strip" class="time-ribbon-strip"></div>
          <div class="time-ribbon-tick tick-midnight">
            <span>00</span>
          </div>
          <div class="time-ribbon-tick tick-dawn">
            <span>06</span>
          </div>
          <div class="time-ribbon-tick tick-noon">
            <span>12</span>
          </div>
          <div class="time-ribbon-tick tick-dusk">
            <span>18</span>
          </div>
          <div id="time-cycle-marker" class="time-ribbon-marker"></div>
        </div>
      </div>
      <div id="experimental-details-state" class="feature-tag">Detailed trees: server off</div>
    </div>
    <div id="status" class="status">Starting</div>
    <div id="metrics" class="metrics">0 chunks loaded</div>
    <div id="coordinates" class="coords">Target pending</div>
    <div id="players" class="players">No players</div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
