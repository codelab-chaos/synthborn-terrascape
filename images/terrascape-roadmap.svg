    <text x="156" y="341" fill="#f6fbff" font-size="37" font-weight="800">v0.1.0 BETA <tspan fill="#8196a6" font-weight="500">— Initial Beta Release</tspan></text>
    <text x="156" y="375" fill="#9fb3c1" font-size="20">Ship the first complete Terrascape experience, including the secure browser console interface.</text>
    <g>
    <rect x="90" y="402" width="388.5" height="190" rx="22" fill="#102334" stroke="#92b8c8" stroke-opacity="0.16"/>
    <rect x="110" y="421" width="56" height="56" rx="16" fill="#51e6c1" fill-opacity="0.14" stroke="#51e6c1" stroke-opacity="0.48"/>
    <text x="138" y="456" fill="#51e6c1" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="0.5">3D</text>
    <rect x="340.5" y="425" width="118" height="28" rx="14" fill="#12332f"/>
    <text x="399.5" y="444" fill="#51e6c1" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">SHIPPED</text>
