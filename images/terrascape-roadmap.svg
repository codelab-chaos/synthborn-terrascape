    <text x="548.5" y="456" fill="#51e6c1" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.5">NPC</text>
    <rect x="751" y="425" width="118" height="28" rx="14" fill="#12332f"/>
    <text x="810" y="444" fill="#51e6c1" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">SHIPPED</text>
