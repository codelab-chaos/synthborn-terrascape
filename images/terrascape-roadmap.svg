    <text x="90" y="143" fill="#f4fbff" font-size="54" font-weight="800">Terrascape Roadmap</text>
    <text x="90" y="190" fill="#a9bdca" font-size="24">Release-grouped direction for the first public beta and its feedback cycle</text>
    <g transform="translate(1465,62)">
      <rect width="245" height="56" rx="28" fill="#102b35" stroke="#51e6c1" stroke-opacity="0.55"/>
      <circle cx="29" cy="28" r="7" fill="#51e6c1"/>
