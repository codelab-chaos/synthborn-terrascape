<g transform="translate(297,-13)"><circle cx="8" cy="8" r="7" fill="#ffcf67"/><text x="25" y="14" fill="#aabdc8" font-size="15" font-weight="700">TO BUILD</text></g>
<g transform="translate(502,-13)"><circle cx="8" cy="8" r="7" fill="#bdadff"/><text x="25" y="14" fill="#aabdc8" font-size="15" font-weight="700">DEMAND-DRIVEN</text></g>
    <text x="1620" y="0" fill="#718998" font-size="15" text-anchor="end">Plans may change with community feedback</text>
