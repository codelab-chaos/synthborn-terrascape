    <text x="1220.5" y="656" fill="#51e6c1" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">SHIPPED</text>
    <text x="931" y="719" fill="#f3f9fc" font-size="23" font-weight="800">Shareable Access</text>
    <text x="931" y="751" fill="#98adba" font-size="16">Support open maps and secure per-player</text>
<text x="931" y="771" fill="#98adba" font-size="16">token-gated links.</text>
  </g>
<g>
    <rect x="1321.5" y="614" width="388.5" height="190" rx="22" fill="#102334" stroke="#92b8c8" stroke-opacity="0.16"/>
    <rect x="1341.5" y="633" width="56" height="56" rx="16" fill="#51e6c1" fill-opacity="0.14" stroke="#51e6c1" stroke-opacity="0.48"/>
    <text x="1369.5" y="668" fill="#51e6c1" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="0.5">&gt;_</text>
    <rect x="1572" y="637" width="118" height="28" rx="14" fill="#12332f"/>
    <text x="1631" y="656" fill="#51e6c1" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">SHIPPED</text>
    <text x="1341.5" y="719" fill="#f3f9fc" font-size="23" font-weight="800">Browser Console Interface</text>
    <text x="1341.5" y="751" fill="#98adba" font-size="16">Provide identity-bound web chat and</text>
<text x="1341.5" y="771" fill="#98adba" font-size="16">permission-checked commands with private</text>
<text x="1341.5" y="791" fill="#98adba" font-size="16">output history.</text>
  </g>
