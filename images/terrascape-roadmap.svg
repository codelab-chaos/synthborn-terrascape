    <text x="138" y="668" fill="#51e6c1" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.5">MAP</text>
    <rect x="340.5" y="637" width="118" height="28" rx="14" fill="#12332f"/>
    <text x="399.5" y="656" fill="#51e6c1" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">SHIPPED</text>
