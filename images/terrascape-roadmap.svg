    <text x="156" y="979" fill="#f6fbff" font-size="37" font-weight="800">v0.1.x BETA <tspan fill="#8196a6" font-weight="500">— Community-Driven Updates</tspan></text>
    <text x="156" y="1013" fill="#9fb3c1" font-size="20">Future improvements will follow the needs players and server owners raise during the beta.</text>
    <g>
    <rect x="90" y="1040" width="388.5" height="190" rx="22" fill="#102334" stroke="#92b8c8" stroke-opacity="0.16"/>
    <rect x="110" y="1059" width="56" height="56" rx="16" fill="#9b8cff" fill-opacity="0.14" stroke="#9b8cff" stroke-opacity="0.48"/>
    <text x="138" y="1094" fill="#9b8cff" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.5">YOU</text>
    <rect x="340.5" y="1063" width="118" height="28" rx="14" fill="#292343"/>
    <text x="399.5" y="1082" fill="#bdadff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">BY REQUEST</text>
    <text x="110" y="1145" fill="#f3f9fc" font-size="23" font-weight="800">Requested Improvements</text>
    <text x="110" y="1177" fill="#98adba" font-size="16">Prioritize meaningful map, camera,</text>
<text x="110" y="1197" fill="#98adba" font-size="16">console, and usability improvements</text>
<text x="110" y="1217" fill="#98adba" font-size="16">requested by the community.</text>
  </g>

  </g>
