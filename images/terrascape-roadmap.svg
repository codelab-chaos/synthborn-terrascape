    <text x="548.5" y="668" fill="#51e6c1" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">TUNE</text>
    <rect x="751" y="637" width="118" height="28" rx="14" fill="#12332f"/>
    <text x="810" y="656" fill="#51e6c1" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">SHIPPED</text>
    <text x="520.5" y="719" fill="#f3f9fc" font-size="23" font-weight="800">Tunable Rendering</text>
    <text x="520.5" y="751" fill="#98adba" font-size="16">Control mesh distance, water, fog,</text>
<text x="520.5" y="771" fill="#98adba" font-size="16">detail, shading, and load budgets.</text>
