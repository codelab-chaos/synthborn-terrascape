    <text x="1369.5" y="456" fill="#51e6c1" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.5">SUN</text>
    <rect x="1572" y="425" width="118" height="28" rx="14" fill="#12332f"/>
    <text x="1631" y="444" fill="#51e6c1" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">SHIPPED</text>
