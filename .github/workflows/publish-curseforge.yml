name: Publish GitHub Release to CurseForge

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub Release tag, for example v0.1.0
        required: true
        type: string
      release_type:
        description: CurseForge release channel
        required: true
        default: release
        type: choice
        options:
          - alpha
          - beta
          - release
      game_version_names:
        description: Comma-separated CurseForge game version names (optional)
        required: false
        type: string
      manual_release:
        description: Hold the approved file for manual release on CurseForge (gated lane only; auto always releases after moderation)
        required: true
        default: true
        type: boolean
      approval:
        description: gated = owner approves the run (feature releases); auto = no approver, only for releases whose changelog has Compatibility/Fixed sections only
        required: true
        default: gated
        type: choice
        options:
          - gated
          - auto

permissions:
  contents: read

concurrency:
  group: curseforge-publish
  cancel-in-progress: false

jobs:
  lane:
    name: Choose approval lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.lane.outputs.environment }}
      manual_release: ${{ steps.lane.outputs.manual_release }}
    steps:
      - name: Check the release qualifies for its lane
        id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVAL: ${{ inputs.approval }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
          # Changelog sections a release may contain and still ship without an approver.
          AUTO_ALLOWED_SECTIONS: Compatibility Fixed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPROVAL" == "gated" ]]; then
            echo "environment=curseforge" >> "$GITHUB_OUTPUT"
            echo "manual_release=$MANUAL_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sections="$(gh release view "$RELEASE_TAG" --json body --jq .body | sed -nE 's/^### +(.+)$/\1/p' | sed -E 's/[[:space:]]+$//')"
          test -n "$sections" || { echo "Release notes for $RELEASE_TAG have no ### sections" >&2; exit 1; }
          disallowed=""
          while IFS= read -r section; do
            [[ " $AUTO_ALLOWED_SECTIONS " == *" $section "* ]] || disallowed+="${section}, "
          done <<<"$sections"
          if [[ -n "$disallowed" ]]; then
            echo "Auto lane is only for releases with ${AUTO_ALLOWED_SECTIONS// /\/} sections; $RELEASE_TAG also has: ${disallowed%, }. Re-run with approval=gated." >&2
            exit 1
          fi
          echo "environment=curseforge-auto" >> "$GITHUB_OUTPUT"
          echo "manual_release=false" >> "$GITHUB_OUTPUT"

  publish:
    name: Upload published release
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.lane.outputs.environment }}

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate publishing configuration
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test -n "$PROJECT_ID"
          test -n "$API_TOKEN"

      - name: Download the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "GitHub Release $RELEASE_TAG is still a draft" >&2
            exit 1
          fi

          mkdir -p candidate
          gh release download "$RELEASE_TAG" \
            --dir candidate \
            --pattern 'Terrascape-*.jar' \
            --pattern SHA256SUMS \
            --pattern release-evidence.env
          gh release view "$RELEASE_TAG" --json body --jq .body \
            > "$RUNNER_TEMP/github-release-notes.md"

      - name: Verify candidate identity and checksum
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "tag=${RELEASE_TAG}" candidate/release-evidence.env
          (
            cd candidate
            sha256sum --check SHA256SUMS
          )

          jar_file="$(sed -n 's/^artifact_file=//p' candidate/release-evidence.env)"
          test -n "$jar_file"
          test -f "candidate/${jar_file}"

      - name: Build CurseForge upload metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/github-release-notes.md
          GAME_VERSION_NAMES: ${{ inputs.game_version_names }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          MANUAL_RELEASE: ${{ needs.lane.outputs.manual_release }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/curseforge-metadata.json"
          const gameVersionNames = process.env.GAME_VERSION_NAMES
            .split(',')
            .map((name) => name.trim())
            .filter(Boolean);
          const metadata = {
            changelog: require('node:fs').readFileSync(process.env.RELEASE_NOTES_FILE, 'utf8'),
            changelogType: 'markdown',
            displayName: `Synthborn: Terrascape ${process.env.RELEASE_TAG}`,
            releaseType: process.env.RELEASE_TYPE,
            isMarkedForManualRelease: process.env.MANUAL_RELEASE === 'true',
          };
          if (gameVersionNames.length) metadata.gameVersionNames = gameVersionNames;
          process.stdout.write(JSON.stringify(metadata));
          NODE

      - name: Upload candidate to CurseForge
        id: upload
        env:
          API_BASE_URL: ${{ vars.CURSEFORGE_API_BASE_URL || 'https://www.curseforge.com' }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(sed -n 's/^artifact_file=//p' candidate/release-evidence.env)"
          response_file="$RUNNER_TEMP/curseforge-response.json"
          if ! curl \
            --fail-with-body \
            --header "X-Api-Token: ${API_TOKEN}" \
            --form "metadata=<$RUNNER_TEMP/curseforge-metadata.json;type=application/json" \
            --form "file=@candidate/${jar_file};type=application/java-archive" \
            --output "$response_file" \
            "${API_BASE_URL%/}/api/projects/${PROJECT_ID}/upload-file"; then
            # The error body and the accepted game version names are safe to print; the
            # token is masked. Without them a 400 is undiagnosable.
            echo "CurseForge rejected the upload:" >&2
            cat "$response_file" >&2 || true
            echo >&2
            echo "Game versions this project's site accepts (name, slug, id):" >&2
            curl --silent --header "X-Api-Token: ${API_TOKEN}" "${API_BASE_URL%/}/api/game/versions" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const v of JSON.parse(s).slice(-40))console.error(`  ${v.name}\t${v.slug}\t${v.id}`)}catch{console.error(s.slice(0,500))}})' || true
            exit 1
          fi

          file_id="$(node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Number.isInteger(response.id)) process.exit(1);
            process.stdout.write(String(response.id));
          ' "$response_file")"
          echo "file-id=$file_id" >> "$GITHUB_OUTPUT"

      - name: Record CurseForge submission
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          FILE_ID: ${{ steps.upload.outputs.file-id }}
        shell: bash
        run: |
          {
            echo "## CurseForge upload"
            echo
            echo "- GitHub Release tag: \`${RELEASE_TAG}\`"
            echo "- CurseForge file ID: \`${FILE_ID}\`"
            echo "- Release type: \`${{ inputs.release_type }}\`"
            echo "- Approval lane: \`${{ inputs.approval }}\` (environment \`${{ needs.lane.outputs.environment }}\`)"
            echo "- Held for manual release: \`${{ needs.lane.outputs.manual_release }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
