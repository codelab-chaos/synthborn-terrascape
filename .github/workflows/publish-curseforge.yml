name: Publish GitHub Release to CurseForge

# Pushing a version tag is the release approval: release-candidate builds the GitHub
# Release and then calls this workflow, which uploads that exact jar to CurseForge.
# CurseForge moderation can take a while; the upload does not wait for it. Each upload is
# recorded on the GitHub Release (curseforge-upload.env) so a rerun never queues a duplicate
# file for review. Dispatch manually only to retry a failed upload or to force a re-upload.

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_type:
        required: false
        default: auto
        type: string
      game_version_names:
        required: false
        default: ""
        type: string
      manual_release:
        required: false
        default: false
        type: boolean
      force:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub Release tag, for example v0.1.2
        required: true
        type: string
      release_type:
        description: CurseForge channel; auto = alpha/beta from a tag suffix, otherwise release
        required: true
        default: auto
        type: choice
        options:
          - auto
          - alpha
          - beta
          - release
      game_version_names:
        description: Comma-separated CurseForge game version names; default derives the Update (e.g. 0.6) from the jar's ServerVersion
        required: false
        type: string
      manual_release:
        description: Hold the file after moderation until it is released by hand on CurseForge
        required: true
        default: false
        type: boolean
      force:
        description: Upload even if this release was already uploaded (queues another review)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Upload published release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: curseforge
    concurrency:
      group: curseforge-publish
      cancel-in-progress: false

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate publishing configuration
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test -n "$PROJECT_ID"
          test -n "$API_TOKEN"

      - name: Skip releases already uploaded
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq curseforge-upload.env; then
            if [[ "$FORCE" == "true" ]]; then
              echo "$RELEASE_TAG was already uploaded; force=true, uploading again"
            else
              gh release download "$RELEASE_TAG" --pattern curseforge-upload.env --output - | sed 's/^/  /'
              echo "$RELEASE_TAG is already on CurseForge (above); skipping so no duplicate is queued for review."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              { echo "## CurseForge upload"; echo; echo "- Skipped: \`${RELEASE_TAG}\` was already uploaded (dispatch with force to re-upload)."; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Download the published GitHub Release
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "GitHub Release $RELEASE_TAG is still a draft" >&2
            exit 1
          fi

          mkdir -p candidate
          gh release download "$RELEASE_TAG" \
            --dir candidate \
            --pattern 'Terrascape-*.jar' \
            --pattern SHA256SUMS \
            --pattern release-evidence.env
          gh release view "$RELEASE_TAG" --json body --jq .body \
            > "$RUNNER_TEMP/github-release-notes.md"

      - name: Verify candidate identity and checksum
        if: steps.dedupe.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "tag=${RELEASE_TAG}" candidate/release-evidence.env
          (
            cd candidate
            sha256sum --check SHA256SUMS
          )

          jar_file="$(sed -n 's/^artifact_file=//p' candidate/release-evidence.env)"
          test -n "$jar_file"
          test -f "candidate/${jar_file}"

      - name: Resolve CurseForge release channel
        id: channel
        if: steps.dedupe.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        shell: bash
        run: |
          set -euo pipefail
          type="$RELEASE_TYPE"
          if [[ -z "$type" || "$type" == "auto" ]]; then
            case "$RELEASE_TAG" in
              *-alpha*) type=alpha ;;
              *-*) type=beta ;;
              *) type=release ;;
            esac
          fi
          [[ "$type" =~ ^(alpha|beta|release)$ ]]
          echo "Release channel: $type"
          echo "release_type=$type" >> "$GITHUB_OUTPUT"

      - name: Resolve CurseForge game version
        id: game
        if: steps.dedupe.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ vars.CURSEFORGE_API_BASE_URL || 'https://www.curseforge.com' }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GAME_VERSION_NAMES: ${{ inputs.game_version_names }}
        shell: bash
        run: |
          set -euo pipefail
          # The mods use Hytale internals, so a file must target the Update it was built for,
          # never the Early Access wildcard. Derive it from the released jar's manifest
          # (ServerVersion ">=0.6.4" -> "0.6") unless names are given explicitly.
          names="$GAME_VERSION_NAMES"
          if [[ -z "$names" ]]; then
            jar_file="$(sed -n 's/^artifact_file=//p' candidate/release-evidence.env)"
            server_version="$(unzip -p "candidate/${jar_file}" manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).ServerVersion||""))')"
            names="$(grep -oE '[0-9]+\.[0-9]+' <<<"$server_version" | head -1)"
            test -n "$names" || { echo "Cannot derive a game version from ServerVersion '$server_version'" >&2; exit 1; }
            echo "Derived game version '$names' from ServerVersion '$server_version'"
          fi
          versions_file="$RUNNER_TEMP/curseforge-game-versions.json"
          curl --fail-with-body --silent --show-error --header "X-Api-Token: ${API_TOKEN}" \
            --output "$versions_file" "${API_BASE_URL%/}/api/game/versions"
          ids="$(NAMES="$names" node -e '
            const versions = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const wanted = process.env.NAMES.split(",").map((n) => n.trim()).filter(Boolean);
            const ids = [];
            for (const name of wanted) {
              const match = versions.filter((v) => v.name === name);
              if (!match.length) {
                console.error(`CurseForge has no game version named "${name}". Available: ${versions.map((v) => v.name).join(", ")}`);
                process.exit(1);
              }
              ids.push(...match.map((v) => v.id));
            }
            process.stdout.write(JSON.stringify([...new Set(ids)]));
          ' "$versions_file")"
          echo "Game versions: $names -> $ids"
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Build CurseForge upload metadata
        if: steps.dedupe.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/github-release-notes.md
          GAME_VERSION_IDS: ${{ steps.game.outputs.ids }}
          RELEASE_TYPE: ${{ steps.channel.outputs.release_type }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/curseforge-metadata.json"
          const metadata = {
            changelog: require('node:fs').readFileSync(process.env.RELEASE_NOTES_FILE, 'utf8'),
            changelogType: 'markdown',
            displayName: `Synthborn: Terrascape ${process.env.RELEASE_TAG}`,
            releaseType: process.env.RELEASE_TYPE,
            isMarkedForManualRelease: process.env.MANUAL_RELEASE === 'true',
          };
          metadata.gameVersions = JSON.parse(process.env.GAME_VERSION_IDS);
          process.stdout.write(JSON.stringify(metadata));
          NODE

      - name: Upload candidate to CurseForge
        id: upload
        if: steps.dedupe.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ vars.CURSEFORGE_API_BASE_URL || 'https://www.curseforge.com' }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(sed -n 's/^artifact_file=//p' candidate/release-evidence.env)"
          response_file="$RUNNER_TEMP/curseforge-response.json"
          if ! curl \
            --fail-with-body \
            --header "X-Api-Token: ${API_TOKEN}" \
            --form "metadata=<$RUNNER_TEMP/curseforge-metadata.json;type=application/json" \
            --form "file=@candidate/${jar_file};type=application/java-archive" \
            --output "$response_file" \
            "${API_BASE_URL%/}/api/projects/${PROJECT_ID}/upload-file"; then
            # The error body and the accepted game version names are safe to print; the
            # token is masked. Without them a 400 is undiagnosable.
            echo "CurseForge rejected the upload:" >&2
            cat "$response_file" >&2 || true
            echo >&2
            echo "Game versions this project's site accepts (name, slug, id):" >&2
            curl --silent --header "X-Api-Token: ${API_TOKEN}" "${API_BASE_URL%/}/api/game/versions" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const v of JSON.parse(s).slice(-40))console.error(`  ${v.name}\t${v.slug}\t${v.id}`)}catch{console.error(s.slice(0,500))}})' || true
            exit 1
          fi

          file_id="$(node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Number.isInteger(response.id)) process.exit(1);
            process.stdout.write(String(response.id));
          ' "$response_file")"
          echo "file-id=$file_id" >> "$GITHUB_OUTPUT"

      - name: Record the upload on the GitHub Release
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FILE_ID: ${{ steps.upload.outputs.file-id }}
          RELEASE_TYPE: ${{ steps.channel.outputs.release_type }}
          GAME_VERSIONS: ${{ steps.game.outputs.names }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tag=${RELEASE_TAG}"
            echo "file_id=${FILE_ID}"
            echo "release_type=${RELEASE_TYPE}"
            echo "game_versions=${GAME_VERSIONS}"
            echo "manual_release=${MANUAL_RELEASE}"
            echo "uploaded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/curseforge-upload.env"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/curseforge-upload.env" --clobber
          {
            echo "## CurseForge upload"
            echo
            echo "- GitHub Release tag: \`${RELEASE_TAG}\`"
            echo "- CurseForge file ID: \`${FILE_ID}\`"
            echo "- Release type: \`${RELEASE_TYPE}\`"
            echo "- Game versions: \`${GAME_VERSIONS}\`"
            echo "- Held for manual release: \`${MANUAL_RELEASE}\`"
            echo "- Now in CurseForge moderation; it goes public when approved."
          } >> "$GITHUB_STEP_SUMMARY"
