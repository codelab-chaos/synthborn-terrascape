name: Publish candidate to CurseForge

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Actions run ID from the successful Release candidate workflow
        required: true
        type: string
      candidate_tag:
        description: Candidate tag, for example v0.1.0
        required: true
        type: string
      release_type:
        description: CurseForge release channel
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - release
      game_version_names:
        description: Comma-separated CurseForge game version names (optional)
        required: false
        type: string
      changelog:
        description: Release notes for this file (Markdown)
        required: true
        type: string
      manual_release:
        description: Hold the approved file for manual release on CurseForge
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: curseforge-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Upload existing candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: curseforge

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate publishing configuration
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test -n "$PROJECT_ID"
          test -n "$API_TOKEN"

      - name: Download the Actions-built candidate
        uses: actions/download-artifact@v5
        with:
          name: terrascape-release-candidate-${{ inputs.candidate_tag }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate identity and checksum
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "tag=${CANDIDATE_TAG}" candidate/release-evidence.env
          grep -Fxq "workflow_run_id=${CANDIDATE_RUN_ID}" candidate/release-evidence.env
          (
            cd candidate
            sha256sum --check SHA256SUMS
          )

          version="${CANDIDATE_TAG#v}"
          test -f "candidate/Terrascape-${version}.jar"

      - name: Build CurseForge upload metadata
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CHANGELOG: ${{ inputs.changelog }}
          GAME_VERSION_NAMES: ${{ inputs.game_version_names }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/curseforge-metadata.json"
          const gameVersionNames = process.env.GAME_VERSION_NAMES
            .split(',')
            .map((name) => name.trim())
            .filter(Boolean);
          const metadata = {
            changelog: process.env.CHANGELOG,
            changelogType: 'markdown',
            displayName: `Synthborn: Terrascape ${process.env.CANDIDATE_TAG}`,
            releaseType: process.env.RELEASE_TYPE,
            isMarkedForManualRelease: process.env.MANUAL_RELEASE === 'true',
          };
          if (gameVersionNames.length) metadata.gameVersionNames = gameVersionNames;
          process.stdout.write(JSON.stringify(metadata));
          NODE

      - name: Upload candidate to CurseForge
        id: upload
        env:
          API_BASE_URL: ${{ vars.CURSEFORGE_API_BASE_URL || 'https://www.curseforge.com' }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${CANDIDATE_TAG#v}"
          response_file="$RUNNER_TEMP/curseforge-response.json"
          curl \
            --fail-with-body \
            --header "X-Api-Token: ${API_TOKEN}" \
            --form "metadata=<$RUNNER_TEMP/curseforge-metadata.json;type=application/json" \
            --form "file=@candidate/Terrascape-${version}.jar;type=application/java-archive" \
            --output "$response_file" \
            "${API_BASE_URL%/}/api/projects/${PROJECT_ID}/upload-file"

          file_id="$(node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Number.isInteger(response.id)) process.exit(1);
            process.stdout.write(String(response.id));
          ' "$response_file")"
          echo "file-id=$file_id" >> "$GITHUB_OUTPUT"

      - name: Record CurseForge submission
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          FILE_ID: ${{ steps.upload.outputs.file-id }}
        shell: bash
        run: |
          {
            echo "## CurseForge upload"
            echo
            echo "- Candidate tag: \`${CANDIDATE_TAG}\`"
            echo "- Candidate workflow run: \`${CANDIDATE_RUN_ID}\`"
            echo "- CurseForge file ID: \`${FILE_ID}\`"
            echo "- Release type: \`${{ inputs.release_type }}\`"
            echo "- Held for manual release: \`${{ inputs.manual_release }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
