name: Build Terrascape

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run web unit tests
        run: npm run test:web

      - name: Build and run Java unit tests
        run: ./gradlew clean build --no-daemon

      - name: Upload manually requested build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: terrascape-build-${{ github.sha }}
          path: build/libs/Terrascape-*.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
