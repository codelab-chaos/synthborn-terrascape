name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Verify tag and source versions agree
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./src/main/resources/manifest.json').Version")"
          gradle_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)"

          for source_version in "$package_version" "$manifest_version" "$gradle_version"; do
            if [[ "$source_version" != "$tag_version" ]]; then
              echo "Tag version $tag_version does not match source version $source_version" >&2
              exit 1
            fi
          done

      - name: Run web unit tests
        run: npm run test:web

      - name: Build and run Java unit tests
        run: ./gradlew clean build --no-daemon

      - name: Inspect candidate jar
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jar_path="build/libs/Terrascape-${version}.jar"
          test -f "$jar_path"

          jar_entries="$(jar tf "$jar_path")"
          for entry in \
            server-config.json \
            web/index.html \
            web/styles.css \
            web/dist/terrascape.js \
            web/npc-details.json; do
            if ! grep -Fxq "$entry" <<<"$jar_entries"; then
              echo "Candidate jar is missing $entry" >&2
              exit 1
            fi
          done

          mkdir -p release-candidate
          cp "$jar_path" release-candidate/
          (
            cd release-candidate
            sha256sum "Terrascape-${version}.jar" > SHA256SUMS
          )
          {
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "artifact_file=Terrascape-${version}.jar"
          } > release-candidate/release-evidence.env

          echo "artifact-name=terrascape-release-candidate-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record candidate evidence
        shell: bash
        run: |
          {
            echo "## Release candidate"
            echo
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`${{ steps.candidate.outputs.artifact-name }}\`"
            echo "- Artifact SHA-256: \`${{ steps.upload.outputs.artifact-digest }}\`"
            echo "- Candidate jar checksum: \`$(cut -d ' ' -f 1 release-candidate/SHA256SUMS)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            release-candidate/Terrascape-*.jar \
            release-candidate/SHA256SUMS \
            release-candidate/release-evidence.env \
            --verify-tag \
            --generate-notes \
            --title "Synthborn: Terrascape ${GITHUB_REF_NAME}" \
            "${prerelease_args[@]}"

          {
            echo
            echo "## GitHub Release"
            echo
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
