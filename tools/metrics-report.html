<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrascape — Baseline Metrics</title>
<style>
  :root {
    --bg: #0d1214; --panel: #141c20; --line: #ffffff1f; --text: #e6eeeb;
    --dim: #9fb0ab; --cold: #5db0ff; --warm: #6fe0b0; --accent: #92e1bf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: 0.03em; }
  h1 small { color: var(--dim); font-weight: 400; font-size: 13px; }
  .controls { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  button, label.file {
    background: #1d282d; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover, label.file:hover { border-color: var(--accent); }
  input[type=file] { display: none; }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  #drop {
    border: 1px dashed var(--line); border-radius: 10px; padding: 40px;
    text-align: center; color: var(--dim); margin: 24px 0;
  }
  #drop.hot { border-color: var(--accent); color: var(--text); background: #ffffff08; }
  .run {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 20px;
  }
  .run h2 { font-size: 15px; margin: 0 0 2px; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
  .chart h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 0 0 10px; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: center; margin: 6px 0; }
  .bar-label { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .bar-track { background: #ffffff10; border-radius: 4px; height: 16px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-fill.cold { background: var(--cold); }
  .bar-fill.warm { background: var(--warm); }
  .bar-val { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 64px; text-align: right; }
  table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 12px; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 600; }
  .legend { display: flex; gap: 16px; color: var(--dim); font-size: 12px; }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .legend .c::before { background: var(--cold); } .legend .w::before { background: var(--warm); }
  .empty { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Terrascape Baseline Metrics <small>mesh &amp; tile · cold vs warm</small></h1>
  <div class="controls">
    <span class="legend"><span class="c">cold (gen)</span><span class="w">warm (cached)</span></span>
    <label class="file">Load JSON…<input id="file" type="file" accept="application/json,.json" multiple></label>
    <button id="clear">Clear</button>
  </div>
</header>
<main>
  <div id="drop">Drop one or more <code>perf-history/baseline-*.json</code> files here, or use “Load JSON…”.</div>
  <div id="runs"></div>
</main>
<script>
  const runsEl = document.getElementById('runs');
  const dropEl = document.getElementById('drop');
  const loaded = [];

  const ORDER = ['mesh/cold', 'mesh/warm', 'tile/cold', 'tile/warm'];
  const pct = (v) => (v == null ? '—' : Math.round(v * 100) + '%');
  const ms = (v) => (v == null ? '—' : v.toLocaleString() + ' ms');
  const mb = (v) => (v == null ? '—' : v + ' MB');

  function rowKey(r) { return `${r.target}/${r.phase}`; }

  function barChart(title, rows, valueOf, fmt) {
    const max = Math.max(1, ...rows.map((r) => valueOf(r) ?? 0));
    const bars = rows.map((r) => {
      const v = valueOf(r) ?? 0;
      const w = Math.max(0, (v / max) * 100);
      return `<div class="bar-row">
        <span class="bar-label">${rowKey(r)}</span>
        <div class="bar-track"><div class="bar-fill ${r.phase}" style="width:${w}%"></div></div>
        <span class="bar-val">${fmt(valueOf(r))}</span>
      </div>`;
    }).join('');
    return `<div class="chart"><h3>${title}</h3>${bars}</div>`;
  }

  function table(rows) {
    const body = rows.map((r) => `<tr>
      <td>${rowKey(r)}</td>
      <td>${ms(r.elapsedMs)}</td>
      <td>${r.bytes != null ? Math.round(r.bytes / 1048576) + ' MB' : '—'}</td>
      <td>${pct(r.server?.cpuPeak)}</td>
      <td>${pct(r.server?.cpuAvg)}</td>
      <td>${r.server?.heapPeakMb != null ? r.server.heapPeakMb + ' MB' : '—'}</td>
      <td>${r.failures ?? 0}</td>
    </tr>`).join('');
    return `<table><thead><tr>
      <th>target/phase</th><th>time</th><th>payload</th><th>cpu peak</th><th>cpu avg</th><th>heap peak</th><th>fail</th>
    </tr></thead><tbody>${body}</tbody></table>`;
  }

  function render() {
    dropEl.style.display = loaded.length ? 'none' : '';
    runsEl.innerHTML = loaded.map((run) => {
      const rows = [...(run.rows || [])].sort((a, b) => ORDER.indexOf(rowKey(a)) - ORDER.indexOf(rowKey(b)));
      const s = run.settings || {};
      const meta = [run.url, s.radius != null ? `radius ${s.radius}` : null,
        s.concurrency != null ? `concurrency ${s.concurrency}` : null].filter(Boolean).join(' · ');
      return `<div class="run">
        <h2>${run.runId || '(run)'}</h2>
        <div class="meta">${meta}</div>
        <div class="grid">
          ${barChart('Time to deliver', rows, (r) => r.elapsedMs, ms)}
          ${barChart('Server CPU peak', rows, (r) => r.server?.cpuPeak, pct)}
          ${barChart('Server heap peak (MB)', rows, (r) => r.server?.heapPeakMb, mb)}
        </div>
        ${table(rows)}
      </div>`;
    }).join('') || '<p class="empty">No runs loaded.</p>';
  }

  function ingest(text, name) {
    try {
      const json = JSON.parse(text);
      if (!json.rows) throw new Error('not a baseline file');
      json.runId = json.runId || name;
      loaded.unshift(json);
      render();
    } catch (e) {
      alert(`Could not read ${name}: ${e.message}`);
    }
  }

  function readFiles(files) {
    [...files].forEach((f) => {
      const reader = new FileReader();
      reader.onload = () => ingest(String(reader.result), f.name);
      reader.readAsText(f);
    });
  }

  document.getElementById('file').addEventListener('change', (e) => readFiles(e.target.files));
  document.getElementById('clear').addEventListener('click', () => { loaded.length = 0; render(); });
  ['dragover', 'dragenter'].forEach((ev) => dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.add('hot'); }));
  ['dragleave', 'drop'].forEach((ev) => dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.remove('hot'); }));
  dropEl.addEventListener('drop', (e) => readFiles(e.dataTransfer.files));
  render();
</script>
</body>
</html>
